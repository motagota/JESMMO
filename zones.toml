# ===========================================================================
# STATIONS (#167). Behaviour lives in `crafting.toml`; this is where they stand.
# ===========================================================================

# The mine yard furnace. It sits OUTSIDE the adit rather than down a gallery,
# and that is the whole shape of the loop: mine ore in the dark, walk out, smelt
# it in the yard. A furnace at the coal face would collapse that into standing
# still, and a smelter underground with no ventilation is also a lie.
#
# 62 units from the adit mouth at (12800, 13500) — close enough that the round
# trip is a beat rather than a haul, far enough that the two are distinct places.
[[station]]
id = "furnace_mine_yard"
type = "furnace"
pos = [12860, 13520]

# The potter's wheel, beside the furnace in the mine yard. Shaping and firing
# are two stations 40 units apart on purpose: the walk between them is what
# makes the two stages feel like two stages.
[[station]]
id = "wheel_mine_yard"
type = "potters_wheel"
# 100 units from the furnace at (12860, 13520), not 40. Both have a 40-unit
# radius, so at 40 apart they OVERLAPPED — a player standing at the wheel was
# inside the furnace's radius too, and which one they got depended on a
# distance comparison they could not see. `check_station_spacing` now refuses
# to boot on that, but the real fix is that shaping and firing are two places.
pos = [12960, 13520]
