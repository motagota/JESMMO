# Deposits — and later stations and recipes — for the starter mine
# (mine epic #164, issue #166). Loaded by the zone processes; the gateway will
# read the same file for stations and recipes in #167.
#
# THIS FILE IS OPTIONAL. Delete it and there are no deposits, which is the world
# before #166. A malformed one refuses to boot naming the fault, same contract
# as `market.toml` and `zones.toml`.
#
# PLACEMENT LIVES IN `zones.toml`. This file is behaviour: what a seam yields,
# how many swings it takes, how long it stays spent.
#
# THE CONTENTION MODEL IS AN ABSENCE. There is no lock on a deposit. Several
# players work one at once, each swing resolving independently, and a late
# arrival still gets value from a partly-worked seam — nobody can body-block a
# node or steal a last hit. The resource is contested; the interaction is not.
# It also means the mine's total output is capped by node count and respawn
# rather than by player count, which is what keeps the coin faucet bounded no
# matter how many people turn up (#170).

# ---------------------------------------------------------------------------
# Iron — the deep working.
#
# The MISS CHANCE is deliberate and load-bearing. At 0.55 a swing comes up empty
# nearly half the time, which together with pickaxe wear (#129 put tool upkeep
# at ~27% of what a tool gathers) and the XP falloff below is what stops a mine
# full of respawning seams being an uncapped coin printer. #170 tunes the three
# together against the wage and bounty benchmarks; do not raise this in
# isolation.
#
# 8 charges x 3s is ~24 seconds of work for ~4.4 ore, before walking.
# ---------------------------------------------------------------------------
[deposit.iron_starter]
display_name = "Iron Deposit"
skill = "mining"
required_level = 1
required_tool = "pickaxe"
charges = 8
swing_time_ms = 3000
durability_per_swing = 1
respawn_seconds = 75
respawn_jitter_seconds = 25
xp_per_swing = 6

# Above this the XP decays toward zero. This is the mechanism that stops the
# tutorial mine being a viable place to grind Mining to cap WITHOUT ever locking
# a newcomer out of it — a level gate would do both, and the second is the one
# that matters in a starter area.
xp_falloff_level = 15

[[deposit.iron_starter.yields]]
item = "iron_ore"
chance = 0.55

# Rock comes with the ore. Not filler: it's the other half of the tool recipes
# (#129 made a pickaxe 3 wood + 5 stone), so a mining trip partly pays for its
# own replacement pick.
[[deposit.iron_starter.yields]]
item = "stone"
qty_min = 1
qty_max = 2
chance = 0.30

# ---------------------------------------------------------------------------
# What levelling a gathering skill buys (#166).
#
# BOTH BONUSES ARE CAPPED, and the cap is the point. An uncapped per-level bonus
# eventually makes a high-level miner strictly better at everything, at which
# point the cap is the only thing between "progression" and "the only correct
# answer". 25% off the swing and a 20% chance at a bonus roll are meaningful
# without being decisive.
#
# The bonus is an extra roll of the WHOLE loot table, not of one line, so it pays
# out in the same proportions the seam does rather than favouring whichever item
# happens to be listed first.
#
# Speed applies to the deposit's own `swing_time_ms`, so a skilled miner is
# faster at every seam without erasing the difference between clay and iron.
# ---------------------------------------------------------------------------
[skill.mining]
speed_bonus_pct_per_level = 0.4
max_speed_bonus_pct = 25
bonus_yield_chance_per_level = 0.3
max_bonus_yield_chance = 20

# ---------------------------------------------------------------------------
# Clay — the tutorial resource, near the mouth.
#
# Faster, more generous and more reliable than iron on purpose: it is the first
# thing a new player is asked to mine (#169's tutorial track), and a first
# experience that misses half the time teaches the wrong lesson. Its lower XP
# and earlier falloff keep it from being the efficient grind despite that.
# ---------------------------------------------------------------------------
[deposit.clay_starter]
display_name = "Clay Seam"
skill = "mining"
required_level = 1
required_tool = "pickaxe"
charges = 10
swing_time_ms = 2400
durability_per_swing = 1
respawn_seconds = 60
respawn_jitter_seconds = 20
xp_per_swing = 4
xp_falloff_level = 12

[[deposit.clay_starter.yields]]
item = "clay_lump"
qty_min = 1
qty_max = 2
chance = 0.80

# ===========================================================================
# STATIONS (#167).
#
# Furnace, kiln, campfire and potter's wheel are ONE entity with a recipe
# filter, not four implementations. `kind` decides the single thing that
# genuinely differs — whether it burns fuel — and `recipe_tags` decides what it
# will make. The next station is an entry in this file, not new code.
#
# PLACEMENT LIVES IN `zones.toml`, same split as deposits: this is behaviour.
# ===========================================================================

# ---------------------------------------------------------------------------
# The public furnace in the mine yard.
#
# JOB SLOTS ARE PER PLAYER, and that is the load-bearing decision here, not an
# optimisation. A queue shared across everyone standing at a public station is
# a griefing surface and a miserable wait — one player fills it and the rest
# watch. Per-player slots are what make a *public* station usable at all.
#
# FUEL, BY CONTRAST, IS SHARED, and that is also a choice rather than an
# oversight. It is a public furnace: whoever loads charcoal is heating the fire
# for whoever is standing there, and a player can burn fuel someone else loaded.
# The alternative — per-player fuel buffers — turns a communal fire into a row
# of private ones and quietly deletes the only cooperative surface the mine has.
# The griefing risk is bounded because fuel is cheap (3 wood for 2 charcoal) and
# a job reserves what it needs the moment it starts.
#
# The fee is 2 GOLD, not copper: a character starts with 500 and wood trades
# around 8-12g. It is a sink and is burned through the same ledger path market
# fees use, so the #154 supply identity still holds.
# ---------------------------------------------------------------------------
[station.furnace]
display_name = "Furnace"
kind = "heat"
recipe_tags = ["smelting"]
job_slots = 2
usage_fee_gold = 2
radius = 40
# Jobs run on while you are offline and the output waits in the slot. A job that
# silently stopped when you walked away would be indistinguishable from a bug.
requires_presence = false

[station.furnace.fuels]
charcoal = 2

# ---------------------------------------------------------------------------
# Smelt Iron Ingot — the first timed recipe in the game.
#
# 2 ore -> 1 ingot is a deliberate LOSS. Smelting is a refining step, and a
# refining step that conserved mass would make ore and ingot the same item with
# two names. The 2:1 ratio is also what gives the ingot a floor price above the
# ore it came from once #144's quality tiers arrive.
#
# 12 seconds against iron's ~24-second seam: long enough that starting a job and
# going back to mine is the obvious play (which is the behaviour the whole timed
# model exists to create), short enough that the tutorial in #169 doesn't stall.
# ---------------------------------------------------------------------------
[recipe.iron_ingot]
display_name = "Smelt Iron Ingot"
tags = ["smelting"]
skill = "smelting"

# ZERO, NOT ONE. `level_for_xp` returns 0 for a skill that has never been
# trained, so 0 is the level every character actually starts at and 1 already
# means "you have done this before". Requiring 1 here locked the game's only
# station recipe against every new player — found by walking a fresh character
# up to the furnace, which is exactly the path #169's tutorial will take.
required_level = 0
output_item = "iron_ingot"
output_qty = 1
fuel_units = 2
duration_ms = 12000
xp = 10

[[recipe.iron_ingot.inputs]]
item = "iron_ore"
qty = 2

# The crucible (#168). OPTIONAL — a smelt without one is a perfectly ordinary
# smelt. That is the load-bearing choice: a required crucible would mean a clay
# shortage stalls the entire iron economy, and every new player would hit a wall
# between "I mined ore" and "I have metal".
#
# 20 uses at 25% means a crucible is worth ~5 extra ingots. Steady, permanent
# demand for potters without making them a chokepoint. If the demand turns out
# too thin, RAISE THE BONUS before making it mandatory.
[recipe.iron_ingot.catalyst]
item = "clay_crucible"
wear = 1
bonus_chance = 25.0
speed_bonus_pct = 15.0

# ---------------------------------------------------------------------------
# Smelting's curve is the same shape as Mining's, and reuses the same type:
# levels buy a faster job and a chance at a bonus output, both capped for the
# same reason (see `[skill.mining]`).
#
# The speed bonus is slightly stronger than Mining's and the bonus-output chance
# weaker. Smelting is pure waiting — there is no swing to time, no seam to walk
# to — so the reward for levelling it should mostly be *less waiting*. A large
# bonus-output chance would instead make the ore conversion rate itself scale
# with level, which is a supply lever, and #170 wants that lever held still.
# ---------------------------------------------------------------------------
[skill.smelting]
speed_bonus_pct_per_level = 0.6
max_speed_bonus_pct = 30
bonus_yield_chance_per_level = 0.2
max_bonus_yield_chance = 12

# ===========================================================================
# POTTERY (#168) — two stages, on purpose.
#
#   Clay Seam  --(pickaxe, mining)-->     Clay Lump
#   Clay Lump  --(wheel, pottery)-->      Greenware   (unfired, fragile)
#   Greenware  --(furnace, pottery)-->    Finished    (fired)
#
# Two stages teach shape-then-heat in miniature, give the wheel a reason to
# exist as its own station, and create a fragile intermediate that is worth
# trading. Greenware is an ordinary tradable commodity — pelts (#159) set that
# precedent and it costs nothing to allow.
#
# WHAT POTTERY ATTACHES TO. The design doc argued for the jug (thirst) and the
# cooking pot (food buffs), and NEITHER SYSTEM EXISTS — vitals are breath (#87)
# and poison (#88). Shipping an item whose stated purpose is a system that
# isn't there would be shipping an ornament while claiming otherwise, so both
# are deferred. The two that ship attach to things that are real:
#
#   Clay Crucible -> the smelting catalyst below. Self-consuming, so the demand
#                    never ends.
#   Storage Jar   -> carry capacity, which is a hard 50 and bites constantly.
#                    (NOT home storage, which the issue proposed: `storage_item`
#                    has no cap at all, so a jar would expand something already
#                    infinite.)
# ===========================================================================

# ---------------------------------------------------------------------------
# The potter's wheel, in the mine yard beside the furnace.
#
# `requires_presence = true` — and this is the first station where that field
# does anything. Shaping is an ACTIVE action: you sit at the wheel and stay
# there. Walk away and the job cancels with everything refunded, which is
# deliberately NOT what a spoiled attempt does. Losing clay to bad luck is the
# mechanic; losing it to a disconnect would be a bug wearing the mechanic's
# clothes.
#
# No fee, unlike the furnace. The wheel costs nothing to run — there is no fire
# to feed — and a fee on the failure-prone station would tax bad luck twice.
#
# One slot, because presence is required anyway: you cannot attend to two
# wheels at once, and pretending otherwise would just be a way to batch.
# ---------------------------------------------------------------------------
[station.potters_wheel]
display_name = "Potter's Wheel"
kind = "shaping"
recipe_tags = ["pottery_shaping"]
job_slots = 1
usage_fee_gold = 0
radius = 40
requires_presence = true

# ---------------------------------------------------------------------------
# Pottery's curve is mostly about NOT FAILING.
#
# Smelting buys speed and Mining buys yield; Pottery buys reliability, because
# that is the axis its recipes actually have. 1.2 points off the failure chance
# per level takes a level-0 potter's 35% crucible down to the floor at about
# level 25 — a real progression that a player can feel in wasted clay.
#
# THE FLOOR IS 8% AND IT NEVER REACHES ZERO. That is the whole economic point:
# it is a permanent material sink, the reason clay seams stay worth working
# after everyone has levelled, and the reason potters keep buying clay forever.
# A mastery curve ending in "no failure ever" would end the demand with it.
# ---------------------------------------------------------------------------
[skill.pottery]
failure_reduction_per_level = 1.2
min_failure_chance = 8.0
speed_bonus_pct_per_level = 0.3
max_speed_bonus_pct = 20
bonus_yield_chance_per_level = 0.0
max_bonus_yield_chance = 0.0

# --- Shaping: clay lump -> greenware --------------------------------------

# The crucible is the harder throw and the earlier unlock, because it is the
# one with a customer. A potter should be able to supply smelters almost
# immediately; the jar is the later, easier convenience.
[recipe.greenware_crucible]
display_name = "Throw a Crucible"
tags = ["pottery_shaping"]
skill = "pottery"
required_level = 0
output_item = "greenware_crucible"
output_qty = 1
duration_ms = 6000
xp = 12
failure_chance = 35.0
# A failed throw still teaches. Half, not zero: the clay and the time were
# spent either way, and a skill whose early levels are pure loss is a skill
# nobody levels — which would turn the failure floor into a wall.
failure_xp_fraction = 0.5

[[recipe.greenware_crucible.inputs]]
item = "clay_lump"
qty = 2

[recipe.greenware_jar]
display_name = "Throw a Storage Jar"
tags = ["pottery_shaping"]
skill = "pottery"
required_level = 18
output_item = "greenware_jar"
output_qty = 1
duration_ms = 9000
xp = 20
failure_chance = 25.0
failure_xp_fraction = 0.5

[[recipe.greenware_jar.inputs]]
item = "clay_lump"
qty = 3

# --- Firing: greenware -> finished, at the furnace -------------------------
#
# Firing cannot fail. The risk in pottery lives at the wheel, where the player
# is present and watching; a kiln that ate finished work while they were away
# would be punishing something they had no way to influence.

[recipe.clay_crucible]
display_name = "Fire a Crucible"
tags = ["smelting"]
skill = "pottery"
required_level = 0
output_item = "clay_crucible"
output_qty = 1
fuel_units = 1
duration_ms = 8000
xp = 8

[[recipe.clay_crucible.inputs]]
item = "greenware_crucible"
qty = 1

[recipe.storage_jar]
display_name = "Fire a Storage Jar"
tags = ["smelting"]
skill = "pottery"
required_level = 18
output_item = "storage_jar"
output_qty = 1
fuel_units = 2
duration_ms = 10000
xp = 14

[[recipe.storage_jar.inputs]]
item = "greenware_jar"
qty = 1
